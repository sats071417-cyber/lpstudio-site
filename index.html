<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Studio</title>
<meta name="description" content="LP Studio は、毎日をちょっと便利にする iPhone アプリを作っています。">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f6f8; --card: #ffffff; --text: #1c1c1e; --muted: #6e6e73; --accent: #f25c54; --line: rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --card: #1c1c1e; --text: #f2f2f7; --muted: #a1a1a6; --line: rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, "Hiragino Sans", "Helvetica Neue", sans-serif; line-height: 1.7; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 16px 64px; }
  .brand { font-size: 2.2rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .lead { color: var(--muted); margin: 8px 0 40px; }
  h2 { font-size: .85rem; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; gap: 16px; align-items: flex-start; }
  .icon { width: 64px; height: 64px; border-radius: 15px; background: var(--accent); flex: none;
          display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 1.4rem; }
  .app h3 { margin: 0; font-size: 1.2rem; }
  .app p { margin: 4px 0 12px; color: var(--muted); }
  .links { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: .95rem; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  footer { margin-top: 48px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
  <p class="brand">LP Studio</p>
  <p class="lead">毎日をちょっと便利にする iPhone アプリを作っています。</p>

  <h2>アプリ</h2>
  <div class="app">
    <div class="icon" aria-hidden="true">M</div>
    <div>
      <h3>MeetApp</h3>
      <p>友達との待ち合わせで、おたがいの現在地と「あと何分で着くか」が、待ち合わせの時間だけ見えるアプリです。</p>
      <div class="links">
        <a href="meetapp/support.html">サポート・お問い合わせ</a>
        <a href="meetapp/privacy.html">プライバシーポリシー</a>
        <a href="meetapp/terms.html">利用規約</a>
      </div>
    </div>
  </div>

  <footer>お問い合わせ：<a href="mailto:support@lpstudio.app">support@lpstudio.app</a></footer>
</main>
</body>
</html>
